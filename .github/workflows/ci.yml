name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cmake ninja-build

      - name: Build firmware
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Build emulator firmware
        run: |
          cmake -S . -B build-emulator -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFDSWRITEUNLOCK_USB_CONSOLE=OFF -DPICO_SDK_PATH="$PWD/build/_deps/pico_sdk-src"
          cmake --build build-emulator

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: test/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: test/pnpm-lock.yaml

      - name: Install test dependencies
        working-directory: test
        run: pnpm install --frozen-lockfile

      - name: Type check tests
        working-directory: test
        run: pnpm typecheck

      - name: Run emulator tests
        working-directory: test
        run: pnpm test

      - name: Upload firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fdswriteunlock-uf2
          path: build/fdswriteunlock.uf2
          if-no-files-found: error
