name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm main is the commit CI verified
        id: verify
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$VERIFIED_SHA" ]; then
            echo "main moved from $VERIFIED_SHA to $head_sha; the newer commit releases itself"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the firmware CI built and tested
        if: steps.verify.outputs.proceed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fdswriteunlock-hex
          path: ${{ runner.temp }}/ci-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and stage the firmware
        if: steps.verify.outputs.proceed == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ci-artifact
        run: |
          set -euo pipefail
          python3 tools/check_hex.py "$ARTIFACT_DIR/fdswriteunlock.hex" --max-bytes 2048
          mkdir -p dist
          cp "$ARTIFACT_DIR/fdswriteunlock.hex" dist/fdswriteunlock.hex
          cd dist
          sha256sum fdswriteunlock.hex > fdswriteunlock.hex.sha256
          cat fdswriteunlock.hex.sha256

      - name: Attest the firmware's build provenance
        if: steps.verify.outputs.proceed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/fdswriteunlock.hex

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.verify.outputs.proceed == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.verify.outputs.proceed == 'true'
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install release tooling
        if: steps.verify.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit release tooling
        if: steps.verify.outputs.proceed == 'true'
        run: pnpm audit --audit-level high

      - name: Release
        if: steps.verify.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm exec semantic-release
