extends: default

ignore: |
  build/
  docs/
  specs/
  node_modules/
  pnpm-lock.yaml

rules:
  document-start: disable
  truthy:
    check-keys: false
  line-length:
    max: 140
    ignore: |
      .github/ISSUE_TEMPLATE/
