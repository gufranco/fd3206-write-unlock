name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag whose GitHub release is missing or incomplete, such as v1.0.5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .tool-versions

      - name: Confirm main is the commit CI verified
        if: github.event_name == 'workflow_run'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$VERIFIED_SHA" ]; then
            echo "main moved from $VERIFIED_SHA to $head_sha; the newer commit releases itself"
            echo "PROCEED=false" >> "$GITHUB_ENV"
          else
            echo "PROCEED=true" >> "$GITHUB_ENV"
            echo "CI_RUN_ID=$CI_RUN_ID" >> "$GITHUB_ENV"
          fi

      - name: Find the CI run that verified the tag being recovered
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 -m tools.release_notes CHANGELOG.md "$TAG" > "$RUNNER_TEMP/release-notes.md"
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if git log -1 --format=%s "$commit" | grep -q '^chore(release): '; then
            commit="$(git rev-parse "$commit^")"
          fi
          run_id="$(gh run list --workflow ci --commit "$commit" --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "no successful ci run on a push of $commit, so there is no verified image to publish" >&2
            exit 1
          fi
          echo "PROCEED=true" >> "$GITHUB_ENV"
          echo "CI_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Download the firmware CI built and tested
        if: env.PROCEED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: fd3206-write-unlock-hex
          path: ${{ runner.temp }}/ci-artifact
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and stage the firmware
        if: env.PROCEED == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ci-artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          for mcu in attiny2313a attiny4313; do
            image="fd3206-write-unlock-$mcu.hex"
            python3 tools/check_hex.py "$ARTIFACT_DIR/$mcu/release/$image" --max-bytes 2048
            cp "$ARTIFACT_DIR/$mcu/release/$image" "dist/$image"
            (cd dist && sha256sum "$image" > "$image.sha256" && cat "$image.sha256")
          done
          cp LICENSE dist/LICENSE.txt

      - name: Attest the firmware's build provenance
        id: provenance
        if: env.PROCEED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*.hex

      - name: Generate the SBOM
        if: env.PROCEED == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/fd3206-write-unlock.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM to the firmware
        if: env.PROCEED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*.hex
          sbom-path: dist/fd3206-write-unlock.spdx.json

      - name: Stage the provenance bundle
        if: env.PROCEED == 'true'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -f "$BUNDLE" dist/fd3206-write-unlock.sigstore.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        if: env.PROCEED == 'true' && github.event_name == 'workflow_run'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: env.PROCEED == 'true' && github.event_name == 'workflow_run'
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install release tooling
        if: env.PROCEED == 'true' && github.event_name == 'workflow_run'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit release tooling
        if: env.PROCEED == 'true' && github.event_name == 'workflow_run'
        run: pnpm audit --audit-level high

      - name: Release
        if: env.PROCEED == 'true' && github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Publish the recovered release
        if: env.PROCEED == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" dist/* --clobber
