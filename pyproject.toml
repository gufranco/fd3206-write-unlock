[project]
name = "fdswriteunlock-tools"
version = "0.0.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 88
target-version = "py313"
include = ["tools/**/*.py", "tests/**/*.py", ".githooks/pre-commit"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PL", "RUF", "ANN", "PT", "RET", "ARG", "PTH", "S"]
ignore = ["S603", "S607", "PT009", "PT027"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S108"]

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
